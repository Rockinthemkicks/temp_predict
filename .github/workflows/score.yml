name: Morning forecast scorecard
on:
  # Main trigger: cron-job.org calls the "workflow_dispatch" API at 7:30 AM
  # Denver every morning (same setup as the 7 PM forecast). GitHub's own
  # schedule ran 5-9 hours late, so it's kept only as a BACKUP: if the
  # morning trigger already emailed today, the backup run still saves any new
  # grades but doesn't send a second email (--once-per-day).
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"   # backup; GitHub usually starts it in the afternoon

concurrency:
  group: scorecard        # never let the trigger and the backup run at once

permissions:
  contents: write   # lets the run save grades into scores/history.csv

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u score_forecasts.py --email --once-per-day
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEMP_FORECAST_EMAIL_TO: ${{ secrets.TEMP_FORECAST_EMAIL_TO }}

      - name: Save grades to repo
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add scores/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new grades to save."
            exit 0
          fi
          git commit -m "Scores through $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

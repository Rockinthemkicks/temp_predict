name: Morning forecast scorecard
on:
  # 14:37 UTC = 7:37 AM Denver in winter (8:37 AM in summer). Timing isn't
  # critical here -- if GitHub runs it late, the scorecard is just later.
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch:   # "Run workflow" button for a manual run

permissions:
  contents: write   # lets the run save grades into scores/history.csv

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u score_forecasts.py --email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEMP_FORECAST_EMAIL_TO: ${{ secrets.TEMP_FORECAST_EMAIL_TO }}

      - name: Save grades to repo
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add scores/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new grades to save."
            exit 0
          fi
          git commit -m "Scores through $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

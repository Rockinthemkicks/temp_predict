name: Data probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, time
          def get(u):
              time.sleep(1.5)
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "temp_predict-probe"}), timeout=30).read())
          keys = ["ftime","ftime_utc","runtime","n_x","txn","tmp","p06","p12","p24","q06","q12","q24","pos","psn","typ","s06","snw"]
          for st in ("KDEN","KNYC","KSEA"):
              for model in ("GFS","NBS"):
                  d = get(f"https://mesonet.agron.iastate.edu/api/1/mos.json?station={st}&model={model}")
                  rows = d.get("data", [])
                  print(f"===== {st} {model} rows={len(rows)}")
                  for r in rows[:22]:
                      print({k: r.get(k) for k in keys if r.get(k) not in (None, "")})
          for st in ("KSEA","KNYC"):
              d = get(f"https://mesonet.agron.iastate.edu/json/cli.py?station={st}&year=2026")
              res = d.get("results", [])
              print(f"===== CLI {st} last 4:", json.dumps(res[-4:], indent=0)[:1500])
          d = get("https://api.open-meteo.com/v1/forecast?latitude=47.45&longitude=-122.31&daily=precipitation_sum,precipitation_probability_max&precipitation_unit=inch&timezone=auto&forecast_days=3")
          print("===== OPEN-METEO", json.dumps(d.get("daily")))
          PY

name: Daily forecast email
on:
  schedule:
    # Two UTC times so exactly one fires per day year-round.
    # 01:17Z = 7:17 PM MDT (summer), 02:17Z = 7:17 PM MST (winter).
    # Odd minute on purpose: GitHub delays runs at the top of the hour the most.
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:       # manual "Run workflow" button (always runs)

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pick the run that matches current Denver time (scheduled runs)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ZONE=$(TZ=America/Denver date +%Z)
          echo "Event=$EVENT Schedule='$SCHEDULE' Denver zone=$ZONE"
          GO=true
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "17 1 * * *" ] && [ "$ZONE" = "MDT" ]; then GO=true
            elif [ "$SCHEDULE" = "17 2 * * *" ] && [ "$ZONE" = "MST" ]; then GO=true
            else GO=false; echo "Not the right run for $ZONE -- skipping."
            fi
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - run: pip install requests certifi
        if: steps.gate.outputs.go == 'true'
      - run: python -u temp_forecast.py --all-cities --email
        if: steps.gate.outputs.go == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEMP_FORECAST_EMAIL_TO: ${{ secrets.TEMP_FORECAST_EMAIL_TO }}
